<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-reload style="background:var(--main-bg-color)">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<style>
	:root {
		font-family:monospace;
		font-size: large;
		--main-bg-color: #ffffff88;
		--secondary-bg-color: #D9D9D9;
		--tertiary-bg-color: #F9F9F9;
		--gate-color: black;
		--connection-color-off: #6495ed;
		--connection-color-on: #a52a2a;
		--connection-color-x: grey;
		--circuit-color: #CF2FDE;
		--verification-color: #008000;
		--failure-color: #ffa500;
		--animation-speed: 0.5s;
	}

	html {
		width:100%;
		height:100%;
	}

	body {
		width:100%;
		height:100%;
		margin:0%;
	}

	button {
		font-family: monospace;

		font-size: medium;
		background-color: var(--main-bg-color);
	}

	button:hover {
		font-size:large;
		background-color: var(--secondary-bg-color);
	}

	.unavailable {
		filter:blur(2px) brightness(50%);
		pointer-events: none;     
  }

	.title {
		margin: 1em;
		font-size: min(20vw, 20vh);
		text-shadow: 0.03em 0.03em var(--connection-color-on), -0.03em -0.03em var(--connection-color-off);
  }

	.menu-column {
		display: flex;
		flex-direction: column;
		align-items: center;
		width:100%;
		height:100%;
	}

	.ridge {
		border: ridge 4px black;
		border-radius: 4px;
	}

	.flash {
		animation:tilt-shaking var(--animation-speed);
	}

	@keyframes tilt-shaking {
		0% { transform: rotate(0deg) scale(1); }
		25% { transform: rotate(5deg) scale(1.2); }
		50% { transform: rotate(0eg) scale(1.25); }
		75% { transform: rotate(-5deg) scale(1.2); }
		100% { transform: rotate(0deg) scale(1); }
	}

	.gold {
		background: linear-gradient(41deg, rgba(241, 253, 118, 0.832) 0%, rgba(255,255,255,1) 50%, rgba(241, 253, 118, 0.832) 100%);
		background-size: 400% 400%;
		animation: gold-shine calc(var(--animation-speed) * 4) alternate ease-in-out infinite; 
	}

	@keyframes gold-shine {
		0% {
			background-position: 75% 0%;
		}

		100% {
			background-position: 0% 75%;
		}
	}

	.fullscreen-message {
		text-align: center;
		width: 100%;
		height: 100%;
	}

	.options {
    display:flex;
    flex-direction:column;
    gap:1em;
  }
</style>
